---
layout: default
---
<article class="post">
  <header class="post-header">
    {% if page.title %}<h1 class="post-title">{{ page.title }}</h1>{% endif %}
    <div class="post-meta">
      {% if page.date %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y 年 %m 月 %d 日" }}</time>{% endif %}
      {% if page.tags and page.tags.size > 0 %}
        <span class="post-tags">
          {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
        </span>
      {% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-nav">
    <a href="{{ '/' | relative_url }}">← 返回首页</a>
  </nav>
</article>
